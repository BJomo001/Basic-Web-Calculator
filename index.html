<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Burger Palace - Fresh, delicious burgers delivered to your door.">
  <title>Smart Calculator | Smart Calculations. Instant Results.</title>
  <link rel="icon" type="image/x-icon" href="Images/favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
	<main class="calculator" aria-label="Calculator">
		<h1>Smart Calculator</h1>
		<input class="display" id="display" type="text" value="0" aria-label="Display" readonly>
		<div class="keys">
			<button class="clear" data-action="clear">AC</button>
			<button class="operator" data-action="sign">±</button>
			<button class="operator" data-action="percent">%</button>
			<button class="operator" data-operator="÷">÷</button>
			<button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
			<button class="operator" data-operator="×">×</button>
			<button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
			<button class="operator" data-operator="−">−</button>
			<button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
			<button class="operator" data-operator="+">+</button>
			<button class="zero" data-digit="0">0</button><button data-action="decimal">.</button>
			<button class="equals" data-action="equals">=</button>
		</div>
	</main>
	<script>
		
	</script>
</body>
</html>
